    <rect x="0" y="0" width="120" height="120" rx="10" ry="10" fill="#4A90E2" />
    <text x="60" y="75" font-family="Arial" font-size="40" fill="#FFFFFF" text-anchor="middle">15</text>
  </g>

  <!-- 笔记图标（右下角） -->
  <g transform="translate(342, 342)">
    <path d="M0 0 H 120 V 120 H 0 Z" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" />
    <line x1="10" y1="30" x2="110" y2="30" stroke="#888888" stroke-width="2" />
    <line x1="10" y1="60" x2="110" y2="60" stroke="#888888" stroke-width="2" />
    <line x1="10" y1="90" x2="110" y2="90" stroke="#888888" stroke-width="2" />
    <path d="M120 0 L120 120 L0 120" fill="none" stroke="#C0C0C0" stroke-width="2" />
  </g>
